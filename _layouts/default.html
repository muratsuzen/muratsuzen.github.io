<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{% if page.url contains '/20' %}is-post{% endif %}">
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-content">
                <div class="sidebar-header">
                    <a href="{{ '/blog/' | relative_url }}" style="text-decoration: none; color: inherit; display: block;">
                        <img src="{{ '/assets/images/profile.jpg' | relative_url }}" alt="Profile" class="profile-img">
                        <h1 class="sidebar-name">Murat Süzen</h1>
                        <p class="sidebar-title">Senior Principal Developer</p>
                    </a>
                </div>
                
                <div class="sidebar-divider"></div>

                <nav class="sidebar-nav">
                    <ul>
                        <li><a href="{{ '/about/' | relative_url }}">About</a></li>
                        <li><a href="{{ '/archive/' | relative_url }}">Archive</a></li>
                        <li><a href="{{ '/contact/' | relative_url }}">Contact</a></li>
                    </ul>
                </nav>

                <div class="sidebar-divider"></div>
            </div>

            <div class="sidebar-footer">
                <a href="https://www.linkedin.com/in/muratsuzen" target="_blank" class="social-link" title="LinkedIn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                </a>
            </div>
        </aside>
        <main class="content">
            <div class="post-wrapper">
                {{ content }}
            </div>
            
            {% if page.url contains '/20' %}
            <aside class="toc-container">
                <div class="toc-title">Jump to</div>
                <nav class="toc-nav">
                    {% include toc.html html=content %}
                </nav>
            </aside>
            {% endif %}
        </main>
    </div>
</body>
</html>
